# Gate the candy manifest against the pinned charly.
name: candy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: candy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the pinned charly source (CI-time temp checkout)
        run: |
          mkdir -p .ci
          git clone --depth 1 --branch v2026.241.1535 https://github.com/opencharly/charly.git .ci/charly

      - uses: actions/setup-go@v5
        with:
          go-version-file: .ci/charly/charly/go.mod
          cache-dependency-path: .ci/charly/charly/go.sum

      - name: Build the charly binary from the pinned checkout
        run: |
          mkdir -p .ci/charly/bin
          cd .ci/charly/charly && go build -buildvcs=false -ldflags "-X main.BuildCalVer=candy-ci" -o ../bin/charly .

      - name: The candy manifest validates at the pinned charly
        run: |
          .ci/charly/bin/charly box validate
