omarchy-base:
    candy:
        version: 2026.242.0000
        description: |
            The Omarchy foundation — package sources, the Omarchy runtime, and a seeded home.
            omarchy-base is the meta every other Omarchy layer composes. It installs
            nothing of its own; composing it yields, in order: pacman pointed at Omarchy's
            own pinned Arch mirror snapshot with the [omarchy] and [multilib] repositories
            and a locally signed packaging key (omarchy-repo), the omarchy and
            omarchy-settings packages plus the CLI tools they call (omarchy-runtime), and
            the /etc/skel tree copied into the image user's home (omarchy-skel). Its
            observable effect is that the Omarchy package tree, the omarchy commands and a
            populated home coexist on the built image.
        candy:
            # BARE sibling names. QualifyRemoteSiblingDeps rewrites these to
            # .../candy/<member> at this repo's own tag, so one external pin on this meta
            # pulls all three members at a matching version. Order is the install order.
            - omarchy-repo
            - omarchy-runtime
            - omarchy-skel
        plan:
            - check: composing the meta yields the Omarchy runtime and a seeded home
              id: omarchy-base-composed
              context:
                - build
              exit_status: 0
              command: |
                  set -eu
                  test -f /usr/share/omarchy/version
                  test -d /usr/share/omarchy/shell
                  test -f "${HOME}/.config/hypr/hyprland.lua"

omarchy-base-skill:
    skill:
        name: omarchy-base
        family: distros
        owner: omarchy-base
        description: |-
            The Omarchy foundation layer — the [omarchy] package sources, Omarchy's pinned
            Arch mirror snapshot, the omarchy/omarchy-settings runtime, and the /etc/skel
            seeding an image user needs.
            MUST be invoked when working with: the omarchy-base meta or any of its
            members, Omarchy package sources, the limine alpm hook masks, or why an
            Omarchy image installs a bootloader it never uses.
        content: |-
            # Candy: omarchy-base

            The foundation every other `layer-omarchy-*` composes. One repo, one external
            pin, three members installed in order.

            ## Composition

            ```yaml
            omarchy-base:
              candy:
                candy: [omarchy-repo, omarchy-runtime, omarchy-skel]
            ```

            Consumers pin **only the meta**, at its sub-path:

            ```yaml
            candy:
              - '@github.com/opencharly/layer-omarchy-base/candy/omarchy-base:v<CalVer>'
            ```

            Members are named by bare sibling name inside the repo and are never pinned
            from outside — they are always installed together.

            ## Why the pacman configuration is a separate, package-less candy

            A candy's `plan:` steps are emitted **after** its `distro:` packages. A single
            candy that both configured pacman and installed from it would therefore
            configure too late. `omarchy-repo` installs nothing; `omarchy-runtime`
            `require:`s it.

            ## The mirror pin is load-bearing

            Omarchy publishes its own snapshot of the Arch repositories and installs
            against that, not upstream Arch. Measured 2026-08-29,
            `stable-mirror.omarchy.org` served `linux 7.1.9.arch1-2` while
            `geo.mirror.pkgbuild.com` was on `7.1.11.arch1-1`. 125 of the 148 base
            packages come from `core`/`extra`/`multilib`, so leaving the base image's Arch
            mirrorlist in place produces a **mixed snapshot** — worse than either pure one,
            and silently so.

            Channel → mirror (upstream's own mapping; note `edge` uses the unprefixed
            host, and there is no `dev` channel):

            | `OMARCHY_CHANNEL` | Arch repos | `[omarchy]` |
            |---|---|---|
            | `stable` (default) | `stable-mirror.omarchy.org` | `pkgs.omarchy.org/stable` |
            | `edge` | `mirror.omarchy.org` | `pkgs.omarchy.org/edge` |
            | `rc` | `rc-mirror.omarchy.org` | `pkgs.omarchy.org/rc` |

            ## Why an image installs a bootloader it never uses

            The `omarchy` package hard-depends on `limine`, `limine-mkinitcpio-hook`,
            `limine-snapper-sync`, `snapper` and `sddm`. A container installs the whole
            boot stack whether it wants it or not.

            `pacman -S --noconfirm --needed omarchy` **exits 0 anyway**, masked or not:
            pacman treats a failed post-transaction hook as non-fatal. The four masks
            exist so an *expected* `error: command failed to execute correctly` does not
            train everyone to ignore that line in build logs.

            Masked (an `/etc/pacman.d/hooks/<name>` entry shadows the package-shipped
            `/usr/share/libalpm/hooks/<name>`):

            - `80-limine-efi-deploy.hook`
            - `10-limine-snapper-lock.hook`
            - `60-limine-mkinitcpio-remove-pre.hook`
            - `90-limine-mkinitcpio-remove-post.hook`

            **Never mask `90-mkinitcpio-install.hook`.** `limine-mkinitcpio-hook` *owns*
            `/etc/pacman.d/hooks/90-mkinitcpio-install.hook`, so pre-creating that path
            aborts the transaction with `failed to commit transaction (conflicting files)`
            — turning a cosmetic warning into a hard failure. Its one remaining non-fatal
            error is accepted; no `ESP_PATH` value silences it, because `limine-entry-tool`
            requires a genuinely mounted FAT32 partition.

            ## charly vendors no Omarchy configuration

            `omarchy` and `omarchy-settings` ship everything —
            `/usr/share/omarchy/{bin,shell,themes,default,install,migrations}` and all of
            `/etc/skel`. There is no copy of `config/hypr/*.lua`, no `themes/` tree and no
            `default/themed/*.tpl` in this repo.

            `omarchy-skel` exists only because a charly image creates its user **before**
            candies run, so `useradd`'s `/etc/skel` copy has already happened and the home
            would otherwise be empty.
