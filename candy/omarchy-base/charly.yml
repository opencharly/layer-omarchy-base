omarchy-base:
    candy:
        description: |
            The Omarchy foundation — package sources, the Omarchy runtime, and a seeded home.
            omarchy-base is the meta every other Omarchy layer composes. It installs
            nothing of its own; composing it yields, in order: pacman pointed at Omarchy's
            own pinned Arch mirror snapshot with the [omarchy] and [multilib] repositories
            and a locally signed packaging key (omarchy-repo), the omarchy and
            omarchy-settings packages plus the CLI tools they call (omarchy-runtime), and
            the /etc/skel tree copied into the image user's home (omarchy-skel). Its
            observable effect is that the Omarchy package tree, the omarchy commands and a
            populated home coexist on the built image.
        candy:
            # BARE sibling names. QualifyRemoteSiblingDeps rewrites these to
            # .../candy/<member> at this repo's own tag, so one external pin on this meta
            # pulls all three members at a matching version. Order is the install order.
            - omarchy-repo
            - omarchy-runtime
            - omarchy-skel
        plan:
            - check: composing the meta yields the Omarchy runtime and a seeded home
              id: omarchy-base-composed
              context:
                - build
              exit_status: 0
              command: |
                  set -eu
                  test -f /usr/share/omarchy/version
                  test -d /usr/share/omarchy/shell
                  test -f "${HOME}/.config/hypr/hyprland.lua"

omarchy-base-skill:
    skill:
        name: omarchy-base
        family: distros
        owner: omarchy-base
