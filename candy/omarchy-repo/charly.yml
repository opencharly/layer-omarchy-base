omarchy-repo:
    candy:
        version: 2026.242.0000
        description: |
            Points pacman at Omarchy's package sources and neutralises the boot hooks a container cannot satisfy.
            omarchy-repo is the first thing every other Omarchy layer needs: it repoints
            /etc/pacman.d/mirrorlist at Omarchy's own pinned Arch mirror snapshot, adds
            the [omarchy] and [multilib] repositories, imports and locally signs the
            Omarchy packaging key, downgrades the base image's preinstalled packages onto
            that snapshot so the image is Omarchy's version set rather than a mix of
            Omarchy's and Arch's, and stops the limine alpm hooks that cannot succeed
            without a mounted ESP from ever being extracted. It installs no packages of
            its own — that is
            deliberate, because a candy's plan: steps are emitted AFTER its distro:
            packages, so a candy that both configured pacman and installed from it would
            configure too late. Members that install packages require: this one instead.
            Verifiable on the built image: pacman resolves core/extra/multilib from an
            omarchy.org host, the [omarchy] repo answers, the key is locally signed, no
            installed package is newer than the snapshot serves, and no limine alpm hook
            is present on the image.
        var:
            # stable is upstream's own default for the release branch. edge and rc exist;
            # there is no dev channel (pkgs.omarchy.org/dev and a mirrorlist-dev are both
            # absent), so the case below has no dev arm on purpose.
            OMARCHY_CHANNEL: stable
        env_accept:
            - name: OMARCHY_CHANNEL
              description: "Omarchy package channel: stable (default), edge, or rc."
        plan:
            - run: write a complete pacman.conf pinned to Omarchy's package sources
              id: omarchy-repo-pacman-conf
              context:
                - build
              # The mirror pin is NOT cosmetic. Omarchy publishes its own snapshot of the
              # Arch repositories and installs against that, not against upstream Arch:
              # measured 2026-08-29, stable-mirror.omarchy.org served linux 7.1.9.arch1-2
              # while geo.mirror.pkgbuild.com was already on 7.1.11.arch1-1. 125 of the
              # 148 base packages come from core/extra/multilib, so leaving the base
              # image's Arch mirrorlist in place would produce a MIXED snapshot — worse
              # than either pure one, and silently so.
              #
              # The whole file is WRITTEN, not appended to or sed-ed. Editing in place is
              # not idempotent against a base image whose pacman.conf this candy does not
              # own: an earlier version of this step inserted after /^\[options\]/ and
              # produced DUPLICATE NoExtract blocks on an image that turned out to carry
              # two [options] sections. Writing the file makes the result a function of
              # this candy alone, and re-running it changes nothing.
              #
              # Modelled on upstream's own default/pacman/pacman-stable.conf, with the
              # mirror INLINED per repository rather than via
              # `Include = /etc/pacman.d/mirrorlist`, so the snapshot is pinned by the
              # file this candy writes rather than by one it would also have to maintain.
              #
              # The five NoExtract rules this candy ADDS keep the alpm hooks that drive
              # limine-entry-tool off the image entirely — see the note on the next step.
              #
              # The base image's OWN NoExtract rules are carried over verbatim rather than
              # dropped. Writing the whole file is what makes this step idempotent, but it
              # also discards whatever the base image had configured, and the Arch
              # container image configures a lot: twelve NoExtract lines that keep man
              # pages, info, GTK docs and non-English locales out of the image, plus
              # `NoExtract = etc/pacman.conf etc/pacman.d/mirrorlist`, which is what stops
              # a pacman upgrade from overwriting the very file this step just wrote.
              # Losing them was measured, not theorised: the snapshot-alignment downgrade
              # emitted 6607 `warning: could not get file information for usr/share/man/...`
              # lines, because pacman was trying to back up files the base image had never
              # extracted — and every package installed afterwards would have carried its
              # full documentation and locale set into the image.
              #
              # They are READ from the live file rather than hardcoded, so this tracks the
              # base image instead of pinning a copy of it that would silently go stale.
              command: |
                  set -eu
                  # Capture before overwriting. `|| true` because a base image with no
                  # NoExtract rules at all is legitimate — the [omarchy] rules below are
                  # then the only ones, which is correct rather than an error.
                  inherited=$(grep -E '^NoExtract' /etc/pacman.conf || true)
                  case "${OMARCHY_CHANNEL}" in
                    stable) mirror=stable-mirror.omarchy.org ;;
                    edge)   mirror=mirror.omarchy.org ;;
                    rc)     mirror=rc-mirror.omarchy.org ;;
                    *) echo "unknown OMARCHY_CHANNEL=${OMARCHY_CHANNEL} (stable|edge|rc)" >&2; exit 1 ;;
                  esac
                  cat > /etc/pacman.conf <<PACMANCONF
                  [options]
                  # Upstream's own [options] (default/pacman/pacman-stable.conf) with two
                  # deliberate omissions:
                  #
                  #  - Color/ILoveCandy/VerbosePkgLists are cosmetic and only add escape
                  #    codes to a build log.
                  #  - DownloadUser = alpm is DROPPED, and this is not a style choice.
                  #    It makes pacman drop privileges to the alpm user for downloads,
                  #    but charly mounts /var/cache/pacman/pkg as a root-owned build
                  #    cache, which alpm cannot write to. Measured: the whole transaction
                  #    dies with "failed to synchronize all databases (failed to retrieve
                  #    some files)". Upstream can use it because a real install writes to
                  #    a normal directory; a cache-mounted build cannot.
                  #
                  # HoldPkg is kept — a cheap safety net against removing pacman or glibc.
                  HoldPkg = pacman glibc
                  Architecture = auto
                  CheckSpace
                  ParallelDownloads = 5
                  SigLevel = Required DatabaseOptional
                  LocalFileSigLevel = Optional

                  NoExtract = usr/share/libalpm/hooks/80-limine-efi-deploy.hook
                  NoExtract = usr/share/libalpm/hooks/10-limine-snapper-lock.hook
                  NoExtract = usr/share/libalpm/hooks/60-limine-mkinitcpio-remove-pre.hook
                  NoExtract = usr/share/libalpm/hooks/90-limine-mkinitcpio-remove-post.hook
                  NoExtract = etc/pacman.d/hooks/90-mkinitcpio-install.hook
                  ${inherited}

                  [core]
                  Server = https://${mirror}/\$repo/os/\$arch

                  [extra]
                  Server = https://${mirror}/\$repo/os/\$arch

                  [multilib]
                  Server = https://${mirror}/\$repo/os/\$arch

                  [omarchy]
                  SigLevel = Optional TrustAll
                  Server = https://pkgs.omarchy.org/${OMARCHY_CHANNEL}/\$arch
                  PACMANCONF

            - run: import and locally sign the Omarchy packaging key
              id: omarchy-repo-keyring
              context:
                - build
              # SigLevel on [omarchy] is `Optional TrustAll` upstream, so this is not
              # strictly required to install — but without it the transaction relies on
              # --noconfirm silently auto-accepting an `Import PGP key F0134EE680CAC571,
              # "Unknown Packager"?` prompt. That is a trust decision, and it should be
              # declared here rather than defaulted by a flag.
              command: |
                  set -eu
                  pacman-key --init
                  pacman-key --populate archlinux
                  pacman-key --recv-keys 40DFB630FF42BCFFB047046CF0134EE680CAC571
                  pacman-key --lsign-key 40DFB630FF42BCFFB047046CF0134EE680CAC571
                  # -Syy, NOT -Sy. The base image ships a sync DB already populated from
                  # UPSTREAM Arch, and Omarchy's mirror is a SNAPSHOT — its databases are
                  # deliberately older. `pacman -Sy` compares freshness and keeps the
                  # newer local DB, so the repoint above would silently have no effect:
                  # pacman would resolve upstream Arch versions and then 404 fetching them
                  # from the snapshot, which serves only its own. Observed exactly that:
                  # the DB offered qt6-base 6.11.2-3 (upstream) while the mirror serves
                  # 6.11.2-2. A forced refresh is the documented way to switch mirrors.
                  pacman -Syy --noconfirm

            - run: align the base image's preinstalled packages with Omarchy's snapshot
              id: omarchy-repo-snapshot-align
              context:
                - build
              # Repointing the mirror is only HALF of pinning the snapshot. The Arch base
              # image arrives with packages already installed at UPSTREAM versions, and
              # pacman never downgrades on its own — so `-Syu --needed <pkgs>` leaves them
              # ahead of the snapshot forever and the image becomes a MIXED set: newly
              # installed packages at Omarchy's versions, preinstalled ones at Arch's.
              # That is precisely the outcome the mirror pin exists to prevent, and it is
              # silent apart from a `warning: X: local (a) is newer than core (b)` line.
              #
              # Measured on a built image before this step existed: openssl 3.6.4-1 vs the
              # snapshot's 3.6.3-1, libksba 1.8.1-1 vs 1.8.0-1, libgcrypt 1.12.3-1 vs
              # 1.12.2-1, libcap-ng 0.9.5-1 vs 0.9.3-1, ca-certificates-mozilla 3.128-1 vs
              # 3.127-1.
              #
              # -Syuu (double u) is pacman's own downgrade-permitting sync. Measured
              # RC=0 with all five downgraded cleanly.
              #
              # ORDERING IS LOAD-BEARING: this runs in omarchy-repo, BEFORE
              # omarchy-runtime installs the `omarchy` package. That package ships a
              # PRE-transaction hook which aborts any direct system upgrade with
              # "Woah partner... This looks like a direct pacman system upgrade" unless
              # OMARCHY_ALLOW_DIRECT_PACMAN=1 is set. Running the alignment here means the
              # hook does not exist yet, so no escape hatch is needed and none is used.
              # (That hook does NOT block targeted installs — verified `pacman -Syu
              # --needed --noconfirm tree` exits 0 on an image with omarchy installed — so
              # charly's normal package path is unaffected and needs no NoExtract entry.)
              command: |
                  set -eu
                  pacman -Syuu --noconfirm

            # WHY OMARCHY'S OWN UPDATE GUARD IS LEFT IN PLACE
            #
            # The `omarchy` package ships 00-omarchy-update-guard.hook, a PreTransaction
            # hook with `Operation = Upgrade` / `Target = *` and `AbortOnFail`. It stops
            # the transaction with "Woah partner... This looks like a direct pacman system
            # upgrade" unless OMARCHY_ALLOW_DIRECT_PACMAN=1 is set.
            #
            # `Target = *` means it is not limited to a bare `pacman -Syu`: ANY
            # transaction containing an upgrade of an already-installed package trips it,
            # including the ordinary `pacman -Syu --needed <pkgs>` charly generates. That
            # really does happen — a full GUI image build aborted after nine minutes on
            # pod-selkies-core's `pacman -Syu --needed wl-clipboard … openssl` with
            # `error: failed to commit transaction (failed to run transaction hooks)`.
            #
            # The first fix attempted here was to NoExtract the guard, next to the limine
            # hooks. That was then TESTED rather than assumed, and the test says it is
            # unnecessary: with the snapshot alignment above in place and the guard still
            # present, the exact command that aborted the GUI build exits 0. The reason is
            # that the guard triggers on UPGRADES, and after the alignment there are none
            # left to perform — every installed package already sits at the snapshot's
            # version. The alignment does not merely paper over the guard; it removes the
            # condition the guard fires on.
            #
            # So the guard stays. Deleting an upstream safety hook needs a demonstrated
            # need, and there is none: the measured failure has a measured fix that does
            # not involve touching it. Fidelity to what Omarchy ships is the whole point
            # of this layer, and that includes the parts that say no.
            #
            # NOTE: there is no separate "mask the hooks" step. The five NoExtract
            # lines added above do the whole job, and they are strictly better than the
            # /etc/pacman.d/hooks/<name> -> /dev/null masking this candy used first:
            #
            #  - Masking CANNOT cover 90-mkinitcpio-install.hook at all.
            #    limine-mkinitcpio-hook OWNS /etc/pacman.d/hooks/90-mkinitcpio-install.hook,
            #    so pre-creating that path aborts the transaction with
            #    `failed to commit transaction (conflicting files)`. NoExtract simply
            #    stops the file being written, with no conflict.
            #
            #  - Masking leaves ONE residual, unmaskable error: limine-entry-tool insists
            #    on a genuinely mounted FAT32 partition, so no ESP_PATH value silences it
            #    ("Boot path '/boot/efi' is not a mounted FAT32 boot partition"). That was
            #    briefly accepted here as cosmetic — pacman treats a failed
            #    post-transaction hook as non-fatal and the install exits 0 either way.
            #    It is NOT cosmetic to charly: `charly check run` fails a build whose log
            #    carries error lines even when podman exits 0
            #    ("image-build exited 0 but its log carries 2 error line(s)"). The R10 gate
            #    is right and the earlier judgement was wrong.
            #
            #  - ENABLE_HOOKS in limine-entry-tool is set by invocation mode, not by
            #    /etc/limine-entry-tool.conf, so there is no supported config switch to
            #    turn the hooks off. NoExtract is pacman's own mechanism for exactly this.
            #
            # Measured: with the five NoExtract lines, `pacman -S --needed omarchy` exits 0
            # with ZERO error lines and no limine hook present anywhere on the image.

            - check: pacman resolves core from an omarchy.org mirror, not from upstream Arch
              id: omarchy-repo-core-mirror
              context:
                - build
              stdout:
                - contains: "omarchy.org"
              command: pacman-conf --repo core Server

            - check: the [omarchy] repository is configured and answers
              id: omarchy-repo-omarchy-repo
              context:
                - build
              stdout:
                - contains: "pkgs.omarchy.org"
              command: pacman-conf --repo omarchy Server

            - check: the [multilib] repository is enabled (the lib32-nvidia-* packages need it)
              id: omarchy-repo-multilib
              context:
                - build
              exit_status: 0
              command: pacman-conf --repo multilib Server

            - check: the Omarchy packaging key is locally signed
              id: omarchy-repo-key-lsigned
              context:
                - build
              stdout:
                - contains: "40DFB630FF42BCFFB047046CF0134EE680CAC571"
              command: pacman-key --list-keys 40DFB630FF42BCFFB047046CF0134EE680CAC571

            - check: the omarchy package resolves from the configured repositories
              id: omarchy-repo-omarchy-resolvable
              context:
                - build
              stdout:
                - contains: "Repository      : omarchy"
              command: pacman -Si omarchy

            - check: no limine alpm hook was extracted onto the image
              id: omarchy-repo-no-limine-hooks
              context:
                - build
              # The hooks drive limine-entry-tool, which requires a genuinely mounted
              # FAT32 ESP and therefore always fails in a container. NoExtract keeps them
              # off the image entirely, so nothing fails and no error line reaches the
              # build log for charly's R10 gate to trip over.
              exit_status: 0
              command: |
                  set -eu
                  found=$(ls /usr/share/libalpm/hooks/ 2>/dev/null | grep -i limine || true)
                  [ -z "$found" ] || { echo "limine hooks were extracted: $found" >&2; exit 1; }
                  [ ! -e /etc/pacman.d/hooks/90-mkinitcpio-install.hook ] || {
                    echo "limine's /etc mkinitcpio hook was extracted" >&2; exit 1; }

            - check: no installed package differs from what Omarchy's snapshot serves
              id: omarchy-repo-snapshot-aligned
              context:
                - build
              # The direct assertion that the image IS the snapshot rather than a mix.
              #
              # `pacman -Sl` annotates a package `[installed: <version>]` ONLY when the
              # installed version differs from the repository's — so one command answers
              # the whole question, for every package, in both directions (ahead or
              # behind). Verified to discriminate rather than merely to pass: on a
              # pre-alignment image the same command lists exactly the five drifted
              # packages, and on an aligned image it lists none.
              #
              #   core ca-certificates-mozilla 3.127-1 [installed: 3.128-1]
              #   core libcap-ng               0.9.3-1 [installed: 0.9.5-1]
              #   core libgcrypt              1.12.2-1 [installed: 1.12.3-1]
              #   core libksba                 1.8.0-1 [installed: 1.8.1-1]
              #   core openssl                 3.6.3-1 [installed: 3.6.4-1]
              #
              # This replaced a `pacman -Q` loop calling `pacman -Si` per package, which
              # was correct but spawned ~500 subprocesses and took over a minute of every
              # build. It also carried a real bug worth recording: under `set -e`, a
              # trailing `cond && cond && echo` chain returns non-zero for every correctly
              # aligned package, which killed the command substitution's subshell and made
              # the check report exit 1 with an EMPTY stderr. The bed caught it.
              #
              # No package is named: the drift set changes every time the Arch base image
              # is rebuilt, so a hardcoded list would silently stop covering it.
              exit_status: 0
              command: |
                  set -eu
                  drift=$(pacman -Sl 2>/dev/null | grep 'installed:' || true)
                  [ -z "$drift" ] || {
                    echo "these packages differ from the Omarchy snapshot:" >&2
                    echo "$drift" >&2
                    exit 1; }

            - check: Omarchy's own pacman update guard is still on the image
              id: omarchy-repo-update-guard-intact
              context:
                - build
              # The inverse of the limine check, and deliberately so. The limine hooks are
              # removed because they cannot succeed in a container; this one is KEPT,
              # because the snapshot alignment removes the condition it fires on rather
              # than the hook itself. Asserting its presence is what stops a future change
              # from quietly deleting an upstream safety mechanism on the grounds that it
              # was once inconvenient.
              exit_status: 0
              command: |
                  set -eu
                  test -e /usr/share/libalpm/hooks/00-omarchy-update-guard.hook || {
                    echo "the omarchy update guard is missing; this layer must not remove it" >&2
                    exit 1; }

            - check: the NoExtract rules that keep those hooks off the image are configured
              id: omarchy-repo-noextract-configured
              context:
                - build
              # Two families, asserted separately because they have different owners and
              # different failure modes.
              #
              # The five limine rules are this candy's own; without them the hooks land
              # and every build log carries errors.
              #
              # The inherited rules come from the base image, and the check is what stops
              # a future edit from writing the file without carrying them over — which
              # already happened once here and cost 6607 warnings plus every man page and
              # locale in the image. `etc/pacman.conf` is called out by name because it is
              # the one that protects this file from being clobbered by a pacman upgrade.
              exit_status: 0
              command: |
                  set -eu
                  mine=$(grep -c '^NoExtract = usr/share/libalpm/hooks/\|^NoExtract = etc/pacman.d/hooks/' /etc/pacman.conf)
                  [ "$mine" -eq 5 ] || { echo "expected 5 limine NoExtract rules, found $mine" >&2; exit 1; }
                  grep -qE '^NoExtract.*usr/share/man' /etc/pacman.conf || {
                    echo "the base image's man-page NoExtract rule was not carried over" >&2; exit 1; }
                  grep -qE '^NoExtract.*etc/pacman\.conf' /etc/pacman.conf || {
                    echo "the base image's etc/pacman.conf NoExtract rule was not carried over" >&2
                    echo "without it a pacman upgrade can overwrite the file this candy writes" >&2
                    exit 1; }