omarchy-repo:
    candy:
        version: 2026.242.0000
        description: |
            Points pacman at Omarchy's package sources and neutralises the boot hooks a container cannot satisfy.
            omarchy-repo is the first thing every other Omarchy layer needs: it repoints
            /etc/pacman.d/mirrorlist at Omarchy's own pinned Arch mirror snapshot, adds
            the [omarchy] and [multilib] repositories, imports and locally signs the
            Omarchy packaging key, and stops the limine alpm hooks that cannot succeed
            without a mounted ESP from ever being extracted. It installs no packages of
            its own — that is
            deliberate, because a candy's plan: steps are emitted AFTER its distro:
            packages, so a candy that both configured pacman and installed from it would
            configure too late. Members that install packages require: this one instead.
            Verifiable on the built image: pacman resolves core/extra/multilib from an
            omarchy.org host, the [omarchy] repo answers, the key is locally signed, and
            no limine alpm hook is present on the image.
        var:
            # stable is upstream's own default for the release branch. edge and rc exist;
            # there is no dev channel (pkgs.omarchy.org/dev and a mirrorlist-dev are both
            # absent), so the case below has no dev arm on purpose.
            OMARCHY_CHANNEL: stable
        env_accept:
            - name: OMARCHY_CHANNEL
              description: "Omarchy package channel: stable (default), edge, or rc."
        plan:
            - run: write a complete pacman.conf pinned to Omarchy's package sources
              id: omarchy-repo-pacman-conf
              context:
                - build
              # The mirror pin is NOT cosmetic. Omarchy publishes its own snapshot of the
              # Arch repositories and installs against that, not against upstream Arch:
              # measured 2026-08-29, stable-mirror.omarchy.org served linux 7.1.9.arch1-2
              # while geo.mirror.pkgbuild.com was already on 7.1.11.arch1-1. 125 of the
              # 148 base packages come from core/extra/multilib, so leaving the base
              # image's Arch mirrorlist in place would produce a MIXED snapshot — worse
              # than either pure one, and silently so.
              #
              # The whole file is WRITTEN, not appended to or sed-ed. Editing in place is
              # not idempotent against a base image whose pacman.conf this candy does not
              # own: an earlier version of this step inserted after /^\[options\]/ and
              # produced DUPLICATE NoExtract blocks on an image that turned out to carry
              # two [options] sections. Writing the file makes the result a function of
              # this candy alone, and re-running it changes nothing.
              #
              # Modelled on upstream's own default/pacman/pacman-stable.conf, with the
              # mirror INLINED per repository rather than via
              # `Include = /etc/pacman.d/mirrorlist`, so the snapshot is pinned by the
              # file this candy writes rather than by one it would also have to maintain.
              #
              # The five NoExtract rules keep the alpm hooks that drive limine-entry-tool
              # off the image entirely — see the note on the next step.
              command: |
                  set -eu
                  case "${OMARCHY_CHANNEL}" in
                    stable) mirror=stable-mirror.omarchy.org ;;
                    edge)   mirror=mirror.omarchy.org ;;
                    rc)     mirror=rc-mirror.omarchy.org ;;
                    *) echo "unknown OMARCHY_CHANNEL=${OMARCHY_CHANNEL} (stable|edge|rc)" >&2; exit 1 ;;
                  esac
                  cat > /etc/pacman.conf <<PACMANCONF
                  [options]
                  # Upstream's own [options] (default/pacman/pacman-stable.conf) with two
                  # deliberate omissions:
                  #
                  #  - Color/ILoveCandy/VerbosePkgLists are cosmetic and only add escape
                  #    codes to a build log.
                  #  - DownloadUser = alpm is DROPPED, and this is not a style choice.
                  #    It makes pacman drop privileges to the alpm user for downloads,
                  #    but charly mounts /var/cache/pacman/pkg as a root-owned build
                  #    cache, which alpm cannot write to. Measured: the whole transaction
                  #    dies with "failed to synchronize all databases (failed to retrieve
                  #    some files)". Upstream can use it because a real install writes to
                  #    a normal directory; a cache-mounted build cannot.
                  #
                  # HoldPkg is kept — a cheap safety net against removing pacman or glibc.
                  HoldPkg = pacman glibc
                  Architecture = auto
                  CheckSpace
                  ParallelDownloads = 5
                  SigLevel = Required DatabaseOptional
                  LocalFileSigLevel = Optional

                  NoExtract = usr/share/libalpm/hooks/80-limine-efi-deploy.hook
                  NoExtract = usr/share/libalpm/hooks/10-limine-snapper-lock.hook
                  NoExtract = usr/share/libalpm/hooks/60-limine-mkinitcpio-remove-pre.hook
                  NoExtract = usr/share/libalpm/hooks/90-limine-mkinitcpio-remove-post.hook
                  NoExtract = etc/pacman.d/hooks/90-mkinitcpio-install.hook

                  [core]
                  Server = https://${mirror}/\$repo/os/\$arch

                  [extra]
                  Server = https://${mirror}/\$repo/os/\$arch

                  [multilib]
                  Server = https://${mirror}/\$repo/os/\$arch

                  [omarchy]
                  SigLevel = Optional TrustAll
                  Server = https://pkgs.omarchy.org/${OMARCHY_CHANNEL}/\$arch
                  PACMANCONF

            - run: import and locally sign the Omarchy packaging key
              id: omarchy-repo-keyring
              context:
                - build
              # SigLevel on [omarchy] is `Optional TrustAll` upstream, so this is not
              # strictly required to install — but without it the transaction relies on
              # --noconfirm silently auto-accepting an `Import PGP key F0134EE680CAC571,
              # "Unknown Packager"?` prompt. That is a trust decision, and it should be
              # declared here rather than defaulted by a flag.
              command: |
                  set -eu
                  pacman-key --init
                  pacman-key --populate archlinux
                  pacman-key --recv-keys 40DFB630FF42BCFFB047046CF0134EE680CAC571
                  pacman-key --lsign-key 40DFB630FF42BCFFB047046CF0134EE680CAC571
                  # -Syy, NOT -Sy. The base image ships a sync DB already populated from
                  # UPSTREAM Arch, and Omarchy's mirror is a SNAPSHOT — its databases are
                  # deliberately older. `pacman -Sy` compares freshness and keeps the
                  # newer local DB, so the repoint above would silently have no effect:
                  # pacman would resolve upstream Arch versions and then 404 fetching them
                  # from the snapshot, which serves only its own. Observed exactly that:
                  # the DB offered qt6-base 6.11.2-3 (upstream) while the mirror serves
                  # 6.11.2-2. A forced refresh is the documented way to switch mirrors.
                  pacman -Syy --noconfirm

            # NOTE: there is no separate "mask the hooks" step. The five NoExtract
            # lines added above do the whole job, and they are strictly better than the
            # /etc/pacman.d/hooks/<name> -> /dev/null masking this candy used first:
            #
            #  - Masking CANNOT cover 90-mkinitcpio-install.hook at all.
            #    limine-mkinitcpio-hook OWNS /etc/pacman.d/hooks/90-mkinitcpio-install.hook,
            #    so pre-creating that path aborts the transaction with
            #    `failed to commit transaction (conflicting files)`. NoExtract simply
            #    stops the file being written, with no conflict.
            #
            #  - Masking leaves ONE residual, unmaskable error: limine-entry-tool insists
            #    on a genuinely mounted FAT32 partition, so no ESP_PATH value silences it
            #    ("Boot path '/boot/efi' is not a mounted FAT32 boot partition"). That was
            #    briefly accepted here as cosmetic — pacman treats a failed
            #    post-transaction hook as non-fatal and the install exits 0 either way.
            #    It is NOT cosmetic to charly: `charly check run` fails a build whose log
            #    carries error lines even when podman exits 0
            #    ("image-build exited 0 but its log carries 2 error line(s)"). The R10 gate
            #    is right and the earlier judgement was wrong.
            #
            #  - ENABLE_HOOKS in limine-entry-tool is set by invocation mode, not by
            #    /etc/limine-entry-tool.conf, so there is no supported config switch to
            #    turn the hooks off. NoExtract is pacman's own mechanism for exactly this.
            #
            # Measured: with the five NoExtract lines, `pacman -S --needed omarchy` exits 0
            # with ZERO error lines and no limine hook present anywhere on the image.

            - check: pacman resolves core from an omarchy.org mirror, not from upstream Arch
              id: omarchy-repo-core-mirror
              context:
                - build
              stdout:
                - contains: "omarchy.org"
              command: pacman-conf --repo core Server

            - check: the [omarchy] repository is configured and answers
              id: omarchy-repo-omarchy-repo
              context:
                - build
              stdout:
                - contains: "pkgs.omarchy.org"
              command: pacman-conf --repo omarchy Server

            - check: the [multilib] repository is enabled (the lib32-nvidia-* packages need it)
              id: omarchy-repo-multilib
              context:
                - build
              exit_status: 0
              command: pacman-conf --repo multilib Server

            - check: the Omarchy packaging key is locally signed
              id: omarchy-repo-key-lsigned
              context:
                - build
              stdout:
                - contains: "40DFB630FF42BCFFB047046CF0134EE680CAC571"
              command: pacman-key --list-keys 40DFB630FF42BCFFB047046CF0134EE680CAC571

            - check: the omarchy package resolves from the configured repositories
              id: omarchy-repo-omarchy-resolvable
              context:
                - build
              stdout:
                - contains: "Repository      : omarchy"
              command: pacman -Si omarchy

            - check: no limine alpm hook was extracted onto the image
              id: omarchy-repo-no-limine-hooks
              context:
                - build
              # The hooks drive limine-entry-tool, which requires a genuinely mounted
              # FAT32 ESP and therefore always fails in a container. NoExtract keeps them
              # off the image entirely, so nothing fails and no error line reaches the
              # build log for charly's R10 gate to trip over.
              exit_status: 0
              command: |
                  set -eu
                  found=$(ls /usr/share/libalpm/hooks/ 2>/dev/null | grep -i limine || true)
                  [ -z "$found" ] || { echo "limine hooks were extracted: $found" >&2; exit 1; }
                  [ ! -e /etc/pacman.d/hooks/90-mkinitcpio-install.hook ] || {
                    echo "limine's /etc mkinitcpio hook was extracted" >&2; exit 1; }

            - check: the NoExtract rules that keep those hooks off the image are configured
              id: omarchy-repo-noextract-configured
              context:
                - build
              # Asserted directly so a future edit that drops them fails here, with a clear
              # message, rather than as a mystery error line in a much later build.
              exit_status: 0
              command: sh -c 'test "$(grep -c "^NoExtract = " /etc/pacman.conf)" -eq 5'
